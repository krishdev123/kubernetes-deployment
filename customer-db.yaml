
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: customer-db-pvc
  namespace: telecom
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-db
  namespace: telecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-db
  template:
    metadata:
      labels:
        app: customer-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: customer_user
            - name: POSTGRES_PASSWORD
              value: customer_pass123
            - name: POSTGRES_DB
              value: customer_db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: customer-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
      volumes:
        - name: customer-storage
          persistentVolumeClaim:
            claimName: customer-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: customer-db
  namespace: telecom
spec:
  selector:
    app: customer-db
  ports:
    - port: 5432
      targetPort: 5432
