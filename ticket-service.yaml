
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: telecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: ticket-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://ticket_user:ticket_pass123@ticket-db:5432/ticket_db
            - name: CUSTOMER_SERVICE_URL
              value: http://customer-service:8001
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: telecom
spec:
  selector:
    app: ticket-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
