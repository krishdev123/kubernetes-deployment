
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: telecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: customer-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://customer_user:customer_pass123@customer-db:5432/customer_db
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: telecom
spec:
  selector:
    app: customer-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
